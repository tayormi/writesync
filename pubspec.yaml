name: writesync
description: A blog engine built with Jaspr that renders markdown files.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  jaspr: ^0.22.2
  jaspr_router: ^0.8.1
  jaspr_riverpod: ^0.4.4
  markdown: ^7.3.0
  path: ^1.9.0
  yaml: ^3.1.2
  meta: ^1.11.0
  collection: ^1.18.0
  js: ^0.6.7
  intl: ^0.19.0
  source_gen: ^4.0.0
  glob: ^2.1.2
  crypto: ^3.0.3
  stream_transform: ^2.1.0
  nanoid2: ^2.0.1
  writesync_lukehog:
    path: plugins/writesync_lukehog
  build: ^4.0.4
  jaspr_tailwind: ^0.3.6

dev_dependencies:
  build_runner: ^2.4.8
  build_web_compilers: ^4.1.0
  jaspr_builder: ^0.22.2
  lints: ^3.0.0
  source_helper: ^1.3.4

jaspr:
  mode: client
  web:
    title: Jaspr Blog
    base: /
  uses-ssr: true
  tailwind:
    source: web/styles.tw.css
    output: web/styles.css
    config: tailwind.config.js
